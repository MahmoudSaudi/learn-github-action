name: Push and Pull Request
on: 
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**" 
  pull_request:
    branches:
      - main
      - "release/**"


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout test
        uses: actions/checkout@v6.1.0
      - name: Run test
        run: npm test

