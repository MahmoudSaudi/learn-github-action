name: New Test Push and Pull Request
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building..."

  deploy:
    needs: [build , test ]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying after build and test..."
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout test
        uses: actions/checkout@v4
      - name: Run test
        run: npm test
