name: jobs file

on:
  workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Current Job is: $ {{ github.job }}"

  job_2:
    runs-on: ubuntu-latest
    steps:
      # 1. لازم تنزل الكود الأول عشان مجلد temp يكون موجود
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تعديل الـ working directory (لو مجلد temp مش موجود في الريبو هيفشل)
      - name: Install and Build
        run: |
          npm install
          npm run build
        working-directory: ./temp
        shell: bash
        
      # 3. تعديل الـ shell عشان يطبع المتغيرات بشكل صح
      - name: Print Environment
        run: printenv
        shell: bash

  job_3:
    runs-on: ubuntu-latest
    needs: [job_1, job_2]
    steps:
      - run: echo "Job ${{ github.job }} is running after job_1 and job_2."
